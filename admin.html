<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>App Admin | Galería SM</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #faf8f5; padding: 20px; color: #2c2927; }
    .container { max-width: 400px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #9c7b50; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.9rem; margin-bottom: 5px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
    .btn { width: 100%; padding: 14px; background: #9c7b50; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; margin-top: 15px; font-weight: 600; }
    .btn:hover { background: #856740; }
    #status { margin-top: 15px; text-align: center; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Nueva Obra</h2>
    <form id="uploadForm">
      <div class="form-group">
        <label>1. Tomar Foto (Cámara)</label>
        <input type="file" id="foto" accept="image/*" capture="environment" required>
      </div>
      <div class="form-group">
        <label>Título de la Obra</label>
        <input type="text" id="titulo" placeholder="Ej. Trazos de Luz" required>
      </div>
      <div class="form-group">
        <label>Categoría / Técnica</label>
        <select id="categoria">
          <option value="Acrílico">Acrílico</option>
          <option value="Óleo">Óleo</option>
          <option value="Técnica Mixta">Técnica Mixta</option>
          <option value="nueva">Crear nueva categoría...</option>
        </select>
      </div>
      <div class="form-group" id="nuevaCatGroup" style="display:none;">
        <label>Escribe la nueva categoría</label>
        <input type="text" id="nuevaCategoria" placeholder="Ej. Acuarela">
      </div>
      <div class="form-group">
        <label>Medidas (cm)</label>
        <input type="text" id="medidas" placeholder="Ej. 100 x 80 cm" required>
      </div>
      <div class="form-group">
        <label>Año</label>
        <input type="number" id="ano" placeholder="Ej. 2026" required>
      </div>
      <button type="submit" class="btn" id="btnGuardar">Guardar y Publicar</button>
      <div id="status"></div>
    </form>
  </div>

  <script>
    // Mostrar campo de nueva categoría si se selecciona
    document.getElementById('categoria').addEventListener('change', function(e) {
      document.getElementById('nuevaCatGroup').style.display = (e.target.value === 'nueva') ? 'block' : 'none';
    });

    // Claude Code: Inyectar lógica de GitHub API aquí (Base64 + Fetch PUT a obras.json e imagen)
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('status').innerText = "Procesando obra... (Falta lógica API de GitHub)";
      document.getElementById('status').style.color = "#9c7b50";
    });
  </script>
</body>
</html>
